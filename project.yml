name: Vertex
options:
  bundleIdPrefix: com.woo642778
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Vertex:
    path: .

targets:
  Vertex:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Resources/AppIconSource.base64
          - GeneratedAIResources
      - path: App/GeneratedAIResources/AIModels
        type: folder
        buildPhase: resources
      - path: App/GeneratedAIResources/AI_MODEL_MANIFEST.json
        buildPhase: resources
      - path: App/GeneratedAIResources/AIModelNotices
        type: folder
        buildPhase: resources
    dependencies:
      - package: Vertex
        product: VertexCore
      - package: Vertex
        product: VertexMedia
      - package: Vertex
        product: VertexMediaAVFoundation
      - package: Vertex
        product: VertexRender
      - package: Vertex
        product: VertexRenderMetal
      - package: Vertex
        product: VertexProject
      - package: Vertex
        product: VertexTimeline
      - package: Vertex
        product: VertexProjectPersistence
      - package: Vertex
        product: VertexComposition
      - package: Vertex
        product: VertexAI
      - package: Vertex
        product: VertexAICoreML
      - package: Vertex
        product: VertexAIAVFoundation
      - package: Vertex
        product: Vertex3D
      - package: Vertex
        product: VertexRender3DMetal
      - package: Vertex
        product: VertexExport
      - package: Vertex
        product: VertexExportAVFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woo642778.aftereffects
        PRODUCT_NAME: Vertex2
        PRODUCT_MODULE_NAME: Vertex
        MARKETING_VERSION: 10.0.0
        CURRENT_PROJECT_VERSION: 10
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Vertex2
        INFOPLIST_KEY_CFBundleName: Vertex2
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photo-video
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - VertexAppTests

  VertexAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/VertexAppTests
    dependencies:
      - target: Vertex
      - package: Vertex
        product: VertexCore
      - package: Vertex
        product: VertexMedia
      - package: Vertex
        product: VertexRender
      - package: Vertex
        product: VertexRenderMetal
      - package: Vertex
        product: VertexProject
      - package: Vertex
        product: VertexTimeline
      - package: Vertex
        product: VertexProjectPersistence
      - package: Vertex
        product: VertexComposition
      - package: Vertex
        product: VertexAI
      - package: Vertex
        product: VertexAICoreML
      - package: Vertex
        product: VertexAIAVFoundation
      - package: Vertex
        product: Vertex3D
      - package: Vertex
        product: VertexRender3DMetal
      - package: Vertex
        product: VertexExport
      - package: Vertex
        product: VertexExportAVFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woo642778.aftereffects.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Vertex2.app/Vertex2
        BUNDLE_LOADER: $(TEST_HOST)
