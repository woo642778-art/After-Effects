name: Apply Vertex2 17 Version

on:
  push:
    branches:
      - agent/phase17-particles-focus-audio
    paths:
      - .github/workflows/phase16-version-apply.yml

permissions:
  contents: write

jobs:
  apply-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase17-particles-focus-audio
          fetch-depth: 0
      - name: Update V17 identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path('project.yml')
          text = project.read_text()
          text = text.replace('MARKETING_VERSION: 16.0.0', 'MARKETING_VERSION: 17.0.0', 1)
          text = text.replace('CURRENT_PROJECT_VERSION: 16', 'CURRENT_PROJECT_VERSION: 17', 1)
          if 'MARKETING_VERSION: 17.0.0' not in text or 'CURRENT_PROJECT_VERSION: 17' not in text:
              raise SystemExit('Unable to establish Vertex2 17 project identity')
          project.write_text(text)

          schema = Path('Sources/VertexProject/ProjectSchema.swift')
          text = schema.read_text()
          text = text.replace('currentAppVersion = "16.0.0"', 'currentAppVersion = "17.0.0"', 1)
          if 'currentAppVersion = "17.0.0"' not in text:
              raise SystemExit('Unable to establish Vertex2 17 app contract')
          schema.write_text(text)
          PY
          git diff --check
      - name: Commit V17 identity
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project.yml Sources/VertexProject/ProjectSchema.swift
          if ! git diff --cached --quiet; then
            git commit -m 'chore: set Vertex2 version to 17.0.0'
            git push origin HEAD:agent/phase17-particles-focus-audio
          fi
