name: Apply expanded effect CGFloat patch
on:
  push:
    paths:
      - .github/workflows/fix-expanded-effect-cgfloat.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase16-effects-expansion
      - name: Patch Core Graphics scalar types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App/NativeExpandedFrameEffectProcessor.swift')
          s = p.read_text()
          replacements = {
            'private func scalar(_ effect: ProjectEffect, _ id: Parameter) throws -> Double {': 'private func scalar(_ effect: ProjectEffect, _ id: Parameter) throws -> CGFloat {',
            '        return value\n    }\n\n    private func radians(_ degrees: Double) -> Double { degrees * .pi / 180 }': '        return CGFloat(value)\n    }\n\n    private func radians(_ degrees: CGFloat) -> CGFloat { degrees * .pi / 180 }',
            'private func scaleRGB(_ image: CIImage, amount: Double) throws -> CIImage {': 'private func scaleRGB(_ image: CIImage, amount: CGFloat) throws -> CIImage {',
            'private func threshold(_ image: CIImage, value: Double) throws -> CIImage {': 'private func threshold(_ image: CIImage, value: CGFloat) throws -> CIImage {',
            'private func lumaMask(_ image: CIImage, threshold value: Double, softness: Double = 0, invert: Bool = false) throws -> CIImage {': 'private func lumaMask(_ image: CIImage, threshold value: CGFloat, softness: CGFloat = 0, invert: Bool = false) throws -> CIImage {'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected source fragment: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App/NativeExpandedFrameEffectProcessor.swift
          git commit -m 'fix: use CGFloat in Core Image geometry paths'
          git push origin HEAD:agent/phase16-effects-expansion
