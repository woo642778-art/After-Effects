name: Phase 9 Task 10 Intel

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/phase9-task10-runner]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: phase9-task10-intel-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  task10-intel:
    if: startsWith(github.head_ref, 'agent/phase9-task10-staging')
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          git config user.name vertex2-phase9-bot
          git config user.email actions@users.noreply.github.com
      - name: Select iPhone and iPad simulators
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json,re,subprocess
          p=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          groups={'IPHONE':[],'IPAD':[]}
          for runtime,ds in p.get('devices',{}).items():
            m=re.search(r'iOS-(\d+)-(\d+)',runtime)
            if not m: continue
            v=(int(m.group(1)),int(m.group(2)))
            for d in ds:
              if not d.get('isAvailable'): continue
              if d['name'].startswith('iPhone'): groups['IPHONE'].append((v,d['name'],d['udid']))
              elif d['name'].startswith('iPad'): groups['IPAD'].append((v,d['name'],d['udid']))
          for key in groups:
            groups[key].sort(reverse=True)
            if not groups[key]: raise SystemExit('Missing '+key)
            print(key+'_UDID='+groups[key][0][2])
          PY
      - name: RED
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task10_red.py
          bash Tools/generate_app_assets.sh
          xcodegen generate
          set +e
          xcodebuild test -project Vertex.xcodeproj -scheme Vertex -sdk iphonesimulator -destination "id=$IPHONE_UDID" -derivedDataPath "$PWD/DD10R" CODE_SIGNING_ALLOWED=NO -only-testing:VertexAppTests/EditorWorkspaceStateTests > "$RUNNER_TEMP/red.log" 2>&1
          s=$?
          set -e
          test "$s" -ne 0
      - name: GREEN iPhone and iPad
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task10_green.py
          xcodegen generate
          xcodebuild test -project Vertex.xcodeproj -scheme Vertex -sdk iphonesimulator -destination "id=$IPHONE_UDID" -derivedDataPath "$PWD/DD10I" CODE_SIGNING_ALLOWED=NO -only-testing:VertexAppTests/EditorWorkspaceStateTests -only-testing:VertexAppTests/AppStartupStateTests
          xcodebuild test -project Vertex.xcodeproj -scheme Vertex -sdk iphonesimulator -destination "id=$IPAD_UDID" -derivedDataPath "$PWD/DD10P" CODE_SIGNING_ALLOWED=NO -only-testing:VertexAppTests/EditorWorkspaceStateTests
          git diff --check
      - name: Commit and push
        run: |
          set -euo pipefail
          git add App/EditorWorkspaceState.swift App/VertexEditorWorkspaceView.swift App/IPadEditorWorkspaceView.swift App/IPhoneEditorWorkspaceView.swift App/RootView.swift App/CompositionPreviewController.swift Tests/VertexAppTests/EditorWorkspaceStateTests.swift
          git commit -m 'feat(ui): add adaptive AE-style editor workspace shell'
          git reset --hard HEAD
          git clean -fd
          git diff --check HEAD~1..HEAD
          git push origin HEAD:"${{ github.head_ref }}"
