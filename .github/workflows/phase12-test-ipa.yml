name: Vertex2 15 Release IPA

on:
  push:
    branches:
      - agent/phase15-effects-architecture
  pull_request:
    branches:
      - agent/phase14-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vertex2-15-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-release:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Verify v15 identity and effects architecture
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION: 15.0.0' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 15' project.yml
          grep -q 'currentAppVersion = "15.0.0"' Sources/VertexProject/ProjectSchema.swift
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: com.woo642778.aftereffects' project.yml
          grep -q 'TARGETED_DEVICE_FAMILY: "2"' project.yml
          grep -q 'ProjectEffectDescriptorRegistry' Sources/VertexProject/ProjectEffectDescriptor.swift
          grep -q 'currentSchemaVersion = 2' Sources/VertexProject/ProjectEffectDescriptor.swift
          grep -q 'ProjectEffectDescriptorRegistry.all.map' App/EffectsAndPresetsView.swift
          git diff --check

      - name: Run portable Swift tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/vertex2-v15-swift-tests.log"

      - name: Validate AI model locks and tooling
        run: |
          set -euo pipefail
          python3 Tools/ai/audit_models.py
          python3 -m unittest discover -s Tests/Tools -p 'test_*.py' -v

      - name: Prepare pinned AI resources
        run: |
          set -euo pipefail
          rm -rf .build/ai-source App/GeneratedAIResources
          python3 Tools/ai/fetch_models.py --destination .build/ai-source
          python3 Tools/ai/audit_models.py --source-root .build/ai-source
          python3 Tools/ai/prepare_coreml_models.py \
            --source-root .build/ai-source \
            --output-root App/GeneratedAIResources \
            --repository-root .

      - name: Generate assets and Xcode project
        run: |
          set -euo pipefail
          bash Tools/generate_app_assets.sh
          xcodegen generate

      - name: Build unsigned iPad Release app
        env:
          VERTEX_AI_MODEL_ROOT: ${{ github.workspace }}/App/GeneratedAIResources
        run: |
          set -o pipefail
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedDataV15Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$RUNNER_TEMP/vertex2-v15-release-build.log"

      - name: Package and audit unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/DerivedDataV15Release/Build/Products/Release-iphoneos/Vertex2.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          FAMILY=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist")
          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          test "$VERSION" = '15.0.0'
          test "$BUILD" = '15'
          test "$BUNDLE" = 'com.woo642778.aftereffects'
          test "$FAMILY" = '2'
          test "$MINIMUM_OS" = '17.0'
          /usr/bin/lipo -info "$APP/Vertex2" | grep -q 'arm64'
          ! /usr/bin/lipo -info "$APP/Vertex2" | grep -q 'x86_64'
          test ! -d "$APP/_CodeSignature"
          test ! -f "$APP/embedded.mobileprovision"
          test -f "$APP/AI_MODEL_MANIFEST.json"
          test -f "$APP/Vertex_VertexRenderMetal.bundle/default.metallib"
          rm -rf Payload artifacts
          mkdir -p Payload artifacts
          cp -R "$APP" Payload/Vertex2.app
          /usr/bin/zip -qry artifacts/Vertex2-15.0.0-unsigned.ipa Payload
          unzip -tq artifacts/Vertex2-15.0.0-unsigned.ipa
          shasum -a 256 artifacts/Vertex2-15.0.0-unsigned.ipa | tee artifacts/Vertex2-15.0.0-unsigned.ipa.sha256
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > artifacts/commit-sha.txt

      - name: Upload v15 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vertex2-15.0.0-unsigned-ipa
          path: |
            artifacts/Vertex2-15.0.0-unsigned.ipa
            artifacts/Vertex2-15.0.0-unsigned.ipa.sha256
            artifacts/commit-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v15.0.0'
          TITLE='Vertex2 15.0.0'
          TARGET='${{ github.event.pull_request.head.sha || github.sha }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$TARGET" --title "$TITLE" --notes-file Documentation/V15_RELEASE_NOTES.md
            gh release upload "$TAG" artifacts/Vertex2-15.0.0-unsigned.ipa artifacts/Vertex2-15.0.0-unsigned.ipa.sha256 --clobber
          else
            gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes-file Documentation/V15_RELEASE_NOTES.md artifacts/Vertex2-15.0.0-unsigned.ipa artifacts/Vertex2-15.0.0-unsigned.ipa.sha256
          fi

      - name: Upload validation and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vertex2-15.0.0-validation-build-logs
          path: |
            ${{ runner.temp }}/vertex2-v15-swift-tests.log
            ${{ runner.temp }}/vertex2-v15-release-build.log
          if-no-files-found: warn
          retention-days: 14
