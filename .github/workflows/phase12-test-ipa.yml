name: Vertex2 16 Release IPA

on:
  push:
    branches:
      - agent/phase16-precomp-effects-performance
  pull_request:
    branches:
      - agent/phase15-effects-architecture
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vertex2-16-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-release:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Verify v16 identity, effects scale, pre-compose, performance, and Focus Music gates
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION: 16.0.0' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 16' project.yml
          grep -q 'currentAppVersion = "16.0.0"' Sources/VertexProject/ProjectSchema.swift
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: com.woo642778.aftereffects' project.yml
          grep -q 'TARGETED_DEVICE_FAMILY: "2"' project.yml
          grep -q 'EffectIndexedCatalog.entries.count == 1_568' Tests/VertexProjectTests/Phase16EffectsCatalogTests.swift
          grep -q 'EffectPreviewUpdateGate' App/AIEffectControlsView.swift
          grep -q 'Thread.current.threadDictionary' App/NativeFrameEffectProcessor.swift
          grep -q 'ProjectPrecomposePlanner' Sources/VertexProject/ProjectPrecomposePlanner.swift
          grep -q 'case glow' Sources/VertexProject/ProjectEffect.swift
          grep -q 'case twirl' Sources/VertexProject/ProjectEffect.swift
          grep -q 'final class FocusMusicPlayer' App/FocusMusicPlayer.swift
          grep -q 'numberOfLoops = -1' App/FocusMusicPlayer.swift
          grep -q 'FocusMusicSynthesizer.render' App/FocusMusicPlayer.swift
          grep -q 'environmentObject(focusMusic)' App/VertexApp.swift
          grep -q 'FocusMusicView()' App/AEWorkspaceChrome.swift
          grep -q 'independent from project/timeline audio' App/FocusMusicPlayer.swift
          git diff --check

      - name: Run portable Swift tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/vertex2-v16-swift-tests.log"

      - name: Validate AI model locks and tooling
        run: |
          set -euo pipefail
          python3 Tools/ai/audit_models.py
          python3 -m unittest discover -s Tests/Tools -p 'test_*.py' -v

      - name: Prepare pinned AI resources
        run: |
          set -euo pipefail
          rm -rf .build/ai-source App/GeneratedAIResources
          python3 Tools/ai/fetch_models.py --destination .build/ai-source
          python3 Tools/ai/audit_models.py --source-root .build/ai-source
          python3 Tools/ai/prepare_coreml_models.py \
            --source-root .build/ai-source \
            --output-root App/GeneratedAIResources \
            --repository-root .

      - name: Generate assets and Xcode project
        run: |
          set -euo pipefail
          bash Tools/generate_app_assets.sh
          xcodegen generate

      - name: Select and boot newest iPad Simulator
        run: |
          set -euo pipefail
          SIM_UDID="$(python3 - <<'PY'
          import json, re, subprocess
          payload = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          candidates = []
          for runtime, devices in payload.get('devices', {}).items():
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  name = device.get('name', '')
                  if device.get('isAvailable') and name.startswith('iPad'):
                      candidates.append((version, 1 if 'Pro' in name else 0, name, device['udid']))
          if not candidates:
              raise SystemExit('No available iPad Simulator found')
          candidates.sort(reverse=True)
          print(candidates[0][3])
          PY
          )"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Run iPad app regression tests
        env:
          VERTEX_AI_MODEL_ROOT: ${{ github.workspace }}/App/GeneratedAIResources
        run: |
          set -o pipefail
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$PWD/DerivedDataV16Tests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee "$RUNNER_TEMP/vertex2-v16-ipad-tests.log"

      - name: Build unsigned iPad Release app
        env:
          VERTEX_AI_MODEL_ROOT: ${{ github.workspace }}/App/GeneratedAIResources
        run: |
          set -o pipefail
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedDataV16Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$RUNNER_TEMP/vertex2-v16-release-build.log"

      - name: Package and audit unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/DerivedDataV16Release/Build/Products/Release-iphoneos/Vertex2.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          FAMILY=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist")
          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          test "$VERSION" = '16.0.0'
          test "$BUILD" = '16'
          test "$BUNDLE" = 'com.woo642778.aftereffects'
          test "$FAMILY" = '2'
          test "$MINIMUM_OS" = '17.0'
          /usr/bin/lipo -info "$APP/Vertex2" | grep -q 'arm64'
          ! /usr/bin/lipo -info "$APP/Vertex2" | grep -q 'x86_64'
          test ! -d "$APP/_CodeSignature"
          test ! -f "$APP/embedded.mobileprovision"
          test -f "$APP/AI_MODEL_MANIFEST.json"
          test -f "$APP/Vertex_VertexRenderMetal.bundle/default.metallib"
          rm -rf Payload artifacts
          mkdir -p Payload artifacts
          cp -R "$APP" Payload/Vertex2.app
          /usr/bin/zip -qry artifacts/Vertex2-16.0.0-unsigned.ipa Payload
          unzip -tq artifacts/Vertex2-16.0.0-unsigned.ipa
          shasum -a 256 artifacts/Vertex2-16.0.0-unsigned.ipa | tee artifacts/Vertex2-16.0.0-unsigned.ipa.sha256
          printf '%s\n' '${{ github.event.pull_request.head.sha || github.sha }}' > artifacts/commit-sha.txt

      - name: Upload v16 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vertex2-16.0.0-unsigned-ipa
          path: |
            artifacts/Vertex2-16.0.0-unsigned.ipa
            artifacts/Vertex2-16.0.0-unsigned.ipa.sha256
            artifacts/commit-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v16.0.0'
          TITLE='Vertex2 16.0.0'
          TARGET='${{ github.event.pull_request.head.sha || github.sha }}'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$TARGET" --title "$TITLE" --notes-file Documentation/V16_RELEASE_NOTES.md
            gh release upload "$TAG" artifacts/Vertex2-16.0.0-unsigned.ipa artifacts/Vertex2-16.0.0-unsigned.ipa.sha256 --clobber
          else
            gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes-file Documentation/V16_RELEASE_NOTES.md artifacts/Vertex2-16.0.0-unsigned.ipa artifacts/Vertex2-16.0.0-unsigned.ipa.sha256
          fi

      - name: Upload validation and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vertex2-16.0.0-validation-build-logs
          path: |
            ${{ runner.temp }}/vertex2-v16-swift-tests.log
            ${{ runner.temp }}/vertex2-v16-ipad-tests.log
            ${{ runner.temp }}/vertex2-v16-release-build.log
          if-no-files-found: warn
          retention-days: 14
