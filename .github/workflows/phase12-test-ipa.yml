name: Vertex2 17 Release IPA

on:
  push:
    branches:
      - agent/phase17-particles-focus-audio
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vertex2-17-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build-release:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Verify V17 identity and feature contracts
        run: |
          set -euo pipefail
          grep -q 'MARKETING_VERSION: 17.0.0' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 17' project.yml
          grep -q 'currentAppVersion = "17.0.0"' Sources/VertexProject/ProjectSchema.swift
          grep -q 'currentSchemaVersion = 5' Sources/VertexProject/ProjectSchema.swift
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: com.woo642778.aftereffects' project.yml
          grep -q 'TARGETED_DEVICE_FAMILY: "2"' project.yml
          grep -q 'ProjectEffectType.allCases.count == 113' Tests/VertexProjectTests/Phase17ParticlesAndProceduralTests.swift
          grep -q 'EffectIndexedCatalog.entries.count == 1_568' Tests/VertexAppTests/EffectsAndPresetsCatalogTests.swift
          grep -q 'tracks.count >= 24' Tests/VertexAppTests/FocusMusicTests.swift
          grep -q 'static let category: AVAudioSession.Category = .playback' App/FocusMusicPlayer.swift
          grep -q 'struct V17GPUFrameEffectProcessor' App/V17GPUFrameEffectProcessor.swift
          grep -q 'float angle=p\[10\]\*0.017453292519943295f' App/V17GPUFrameEffectProcessor.swift
          grep -q 'ProjectPrecomposePlanner' Sources/VertexProject/ProjectPrecomposePlanner.swift
          git diff --check

      - name: Run portable Swift tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/vertex2-v17-swift-tests.log"

      - name: Validate AI model locks and tooling
        run: |
          set -euo pipefail
          python3 Tools/ai/audit_models.py
          python3 -m unittest discover -s Tests/Tools -p 'test_*.py' -v

      - name: Prepare pinned AI resources
        run: |
          set -euo pipefail
          rm -rf .build/ai-source App/GeneratedAIResources
          python3 Tools/ai/fetch_models.py --destination .build/ai-source
          python3 Tools/ai/audit_models.py --source-root .build/ai-source
          python3 Tools/ai/prepare_coreml_models.py \
            --source-root .build/ai-source \
            --output-root App/GeneratedAIResources \
            --repository-root .

      - name: Generate assets and Xcode project
        run: |
          set -euo pipefail
          bash Tools/generate_app_assets.sh
          xcodegen generate

      - name: Select and boot newest iPad Simulator
        run: |
          set -euo pipefail
          SIM_UDID="$(python3 - <<'PY'
          import json, re, subprocess
          payload = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          candidates = []
          for runtime, devices in payload.get('devices', {}).items():
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  name = device.get('name', '')
                  if device.get('isAvailable') and name.startswith('iPad'):
                      candidates.append((version, 1 if 'Pro' in name else 0, name, device['udid']))
          if not candidates:
              raise SystemExit('No available iPad Simulator found')
          candidates.sort(reverse=True)
          print(candidates[0][3])
          PY
          )"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Run complete iPad app regression tests
        env:
          VERTEX_AI_MODEL_ROOT: ${{ github.workspace }}/App/GeneratedAIResources
        run: |
          set -o pipefail
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$PWD/DerivedDataV17Tests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee "$RUNNER_TEMP/vertex2-v17-ipad-tests.log"

      - name: Build unsigned iPad Release app
        env:
          VERTEX_AI_MODEL_ROOT: ${{ github.workspace }}/App/GeneratedAIResources
        run: |
          set -o pipefail
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedDataV17Release" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$RUNNER_TEMP/vertex2-v17-release-build.log"

      - name: Package and audit unsigned IPA
        run: |
          set -euo pipefail
          APP="$PWD/DerivedDataV17Release/Build/Products/Release-iphoneos/Vertex2.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          FAMILY=$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily:0' "$APP/Info.plist")
          MINIMUM_OS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")
          test "$VERSION" = '17.0.0'
          test "$BUILD" = '17'
          test "$BUNDLE" = 'com.woo642778.aftereffects'
          test "$FAMILY" = '2'
          test "$MINIMUM_OS" = '17.0'
          /usr/bin/lipo -info "$APP/Vertex2" | grep -q 'arm64'
          ! /usr/bin/lipo -info "$APP/Vertex2" | grep -q 'x86_64'
          test ! -d "$APP/_CodeSignature"
          test ! -f "$APP/embedded.mobileprovision"
          test -f "$APP/AI_MODEL_MANIFEST.json"
          test -f "$APP/Vertex_VertexRenderMetal.bundle/default.metallib"
          test -d "$APP/AIModels/DepthAnythingV2SmallF16.mlmodelc"
          test -d "$APP/AIModels/RealESRGAN-x4v3-denoise.mlmodelc"
          test -d "$APP/AIModels/RealESRGAN-x4v3.mlmodelc"
          MODEL_COUNT="$(find "$APP/AIModels" -maxdepth 1 -type d -name '*.mlmodelc' | wc -l | tr -d ' ')"
          test "$MODEL_COUNT" = '3'
          rm -rf Payload artifacts
          mkdir -p Payload artifacts
          cp -R "$APP" Payload/Vertex2.app
          /usr/bin/zip -qry artifacts/Vertex2-17.0.0-unsigned.ipa Payload
          unzip -tq artifacts/Vertex2-17.0.0-unsigned.ipa
          shasum -a 256 artifacts/Vertex2-17.0.0-unsigned.ipa | tee artifacts/Vertex2-17.0.0-unsigned.ipa.sha256
          printf '%s\n' '${{ github.sha }}' > artifacts/Vertex2-17.0.0-commit-sha.txt

      - name: Upload V17 IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vertex2-17.0.0-unsigned-ipa
          path: |
            artifacts/Vertex2-17.0.0-unsigned.ipa
            artifacts/Vertex2-17.0.0-unsigned.ipa.sha256
            artifacts/Vertex2-17.0.0-commit-sha.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v17.0.0'
          TITLE='Vertex2 17.0.0'
          TARGET='${{ github.sha }}'
          NOTES='Vertex2 17.0.0 expands the executable effects catalog, adds deterministic Metal particle/procedural rendering, and improves persistent Focus Music while retaining the iPad-only editing architecture.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" artifacts/Vertex2-17.0.0-unsigned.ipa artifacts/Vertex2-17.0.0-unsigned.ipa.sha256 --clobber
          else
            gh release create "$TAG" --target "$TARGET" --title "$TITLE" --notes "$NOTES" artifacts/Vertex2-17.0.0-unsigned.ipa artifacts/Vertex2-17.0.0-unsigned.ipa.sha256
          fi

      - name: Upload validation and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vertex2-17.0.0-validation-build-logs
          path: |
            ${{ runner.temp }}/vertex2-v17-swift-tests.log
            ${{ runner.temp }}/vertex2-v17-ipad-tests.log
            ${{ runner.temp }}/vertex2-v17-release-build.log
          if-no-files-found: warn
          retention-days: 14
