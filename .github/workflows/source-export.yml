name: Vertex2 Source Export

on:
  push:
    branches:
      - agent/phase28-source-export
  pull_request:
    branches:
      - agent/phase12-media-effects-automation
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Package source tree
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_HEAD.txt
          tar --exclude=.git -czf "$RUNNER_TEMP/vertex2-source.tar.gz" .
          test -s "$RUNNER_TEMP/vertex2-source.tar.gz"
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: vertex2-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/vertex2-source.tar.gz
            SOURCE_HEAD.txt
          if-no-files-found: error
          retention-days: 1
