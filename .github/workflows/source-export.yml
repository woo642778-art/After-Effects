name: Vertex2 Source Export

on:
  push:
    branches:
      - agent/phase28-source-export
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package source tree
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_HEAD.txt
          tar --exclude=.git -czf vertex2-source.tar.gz .
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: vertex2-source-${{ github.sha }}
          path: |
            vertex2-source.tar.gz
            SOURCE_HEAD.txt
          if-no-files-found: error
          retention-days: 1
