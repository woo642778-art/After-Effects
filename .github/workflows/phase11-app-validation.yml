name: Vertex2 Phase 11 App Validation

on:
  pull_request:
    branches:
      - agent/phase10-ipad-ae-3d
  workflow_dispatch:

concurrency:
  group: phase11-app-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipad-app-tests:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version
      - name: Verify iPad-only landscape contract
        run: |
          set -euo pipefail
          grep -q 'TARGETED_DEVICE_FAMILY: "2"' project.yml
          grep -q 'INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight' project.yml
          if grep -q 'UISupportedInterfaceOrientations_iPhone' project.yml; then
            echo 'iPhone orientation configuration is still present'
            exit 1
          fi
      - name: Generate assets and Xcode project
        run: |
          set -euo pipefail
          bash Tools/generate_app_assets.sh
          xcodegen generate
      - name: Select and boot newest iPad Simulator
        run: |
          set -euo pipefail
          SIM_UDID="$(python3 - <<'PY'
          import json, re, subprocess
          payload = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          candidates = []
          for runtime, devices in payload.get('devices', {}).items():
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  name = device.get('name', '')
                  if device.get('isAvailable') and name.startswith('iPad'):
                      pro_rank = 1 if 'Pro' in name else 0
                      candidates.append((version, pro_rank, name, device['udid']))
          if not candidates:
              raise SystemExit('No available iPad Simulator found')
          candidates.sort(key=lambda item: (item[0], item[1], item[2]), reverse=True)
          print(candidates[0][3])
          PY
          )"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
      - name: Run Vertex app tests on iPad
        run: |
          set -o pipefail
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$PWD/DerivedDataPhase11App" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test | tee "$RUNNER_TEMP/phase11-app-tests.log"
      - name: Upload iPad test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-app-test-log
          path: ${{ runner.temp }}/phase11-app-tests.log
          if-no-files-found: warn
          retention-days: 7
