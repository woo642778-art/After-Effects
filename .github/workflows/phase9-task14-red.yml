name: Phase 9 Task 14 RED

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/phase9-task11-14-runner]

jobs:
  task14-red:
    if: startsWith(github.head_ref, 'agent/phase9-task11-14-staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prove contextual effect error case is missing
        run: |
          cat > "$RUNNER_TEMP/task14-red-main.swift" <<'SWIFT'
          import Foundation
          let error = CompositionError.effectResolutionFailed(
              layerID: "layer-1", effectID: "effect-1", effectType: "depthMap",
              time: "7/30s", message: "model unavailable"
          )
          print(error.localizedDescription)
          SWIFT
          set +e
          swiftc Sources/VertexComposition/CompositionError.swift "$RUNNER_TEMP/task14-red-main.swift" -o "$RUNNER_TEMP/task14-red" > "$RUNNER_TEMP/task14-red.log" 2>&1
          s=$?
          set -e
          test "$s" -ne 0
          grep -q "has no member 'effectResolutionFailed'" "$RUNNER_TEMP/task14-red.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-task14-red
          path: ${{ runner.temp }}/task14-red.log
          retention-days: 3
