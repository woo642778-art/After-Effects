name: Apply effects expansion descriptors
on:
  push:
    paths:
      - .github/workflows/apply-effects-expansion-descriptors.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase16-effects-expansion
      - name: Write expansion descriptors and patch registry
        env:
          DESCRIPTORS_GZ_B64: 
        run: |
          python3 - <<'PY'
          import base64, gzip, os, pathlib
          root = pathlib.Path('.')
          data = gzip.decompress(base64.b64decode(os.environ['DESCRIPTORS_GZ_B64']))
          (root / 'Sources/VertexProject/ProjectEffectExpansionDescriptors.swift').write_bytes(data)
          path = root / 'Sources/VertexProject/ProjectEffectDescriptor.swift'
          text = path.read_text()
          text = text.replace('    case distort\n    case ai\n', '    case distort\n    case tile\n    case keying\n    case ai\n')
          text = text.replace('        case .distort: "Distort"\n        case .ai: "AI"\n', '        case .distort: "Distort"\n        case .tile: "Tile"\n        case .keying: "Keying"\n        case .ai: "AI"\n')
          marker = '    ]\n\n    private static let byType:'
          replacement = '    ] + ProjectEffectExpansionDescriptors.all\n\n    private static let byType:'
          if marker not in text:
              raise SystemExit('descriptor registry marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
      - name: Commit generated descriptor expansion
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/VertexProject/ProjectEffectDescriptor.swift Sources/VertexProject/ProjectEffectExpansionDescriptors.swift
          git commit -m 'feat: add descriptors for expanded native effects'
          git push origin HEAD:agent/phase16-effects-expansion
