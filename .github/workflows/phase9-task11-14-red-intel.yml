name: Phase 9 Tasks 11-14 RED Intel

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/phase9-task11-14-runner]

jobs:
  red-intel:
    if: startsWith(github.head_ref, 'agent/phase9-task11-14-staging')
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Select newest installed Xcode 16
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -type d -name 'Xcode_16*.app' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          bash Tools/generate_app_assets.sh
          xcodegen generate
      - name: Prove RED
        run: |
          set +e
          xcodebuild build -project Vertex.xcodeproj -scheme Vertex -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/red.log" 2>&1
          s=$?
          set -e
          test "$s" -ne 0
          grep -Eq "cannot find '(AETimelineInteractionModel|EffectControlAction|GraphEditorMath|AIEffectPresentationState)' in scope" "$RUNNER_TEMP/red.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-task11-14-red-intel
          path: ${{ runner.temp }}/red.log
          if-no-files-found: warn
          retention-days: 3
