name: Phase Build and Unsigned IPA

on:
  push:
    branches:
      - main
      - "agent/**"
    paths-ignore:
      - "Documentation/**"
      - "docs/**"
      - "README.md"
  pull_request:
    paths-ignore:
      - "Documentation/**"
      - "docs/**"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: phase-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Vertex portable core, media, and render tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Run deterministic portable tests
        run: swift test

  unsigned-ipa:
    name: Build After Effects 4.0.0 unsigned IPA
    runs-on: macos-15
    needs: portable-tests
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Compile Metal shader source
        run: |
          set -euo pipefail
          xcrun -sdk macosx metal \
            -c Sources/VertexRenderMetal/Shaders/VertexRenderKernels.metal \
            -o "$RUNNER_TEMP/VertexRenderKernels.air"

      - name: Run native Metal fixture tests
        run: swift test --filter VertexRenderMetalTests

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate supplied icon assets
        run: bash Tools/generate_app_assets.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS application without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify product identity, version, architecture, and render resources
        run: |
          set -euo pipefail
          APP_PATH="$PWD/DerivedData/Build/Products/Release-iphoneos/AfterEffects.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test -f "$APP_PATH/Vertex_VertexRenderMetal.bundle/default.metallib"
          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test "$DISPLAY_NAME" = "After Effects"
          test "$VERSION" = "4.0.0"
          test "$BUILD" = "4"
          test "$BUNDLE_ID" = "com.woo642778.aftereffects"
          /usr/bin/file "$APP_PATH/AfterEffects" | /usr/bin/grep -q "arm64"

      - name: Package unsigned IPA and checksum
        run: |
          set -euo pipefail
          APP_PATH="$PWD/DerivedData/Build/Products/Release-iphoneos/AfterEffects.app"
          rm -rf Payload artifacts
          mkdir -p Payload artifacts
          cp -R "$APP_PATH" Payload/AfterEffects.app
          /usr/bin/zip -qry artifacts/After-Effects-4.0.0-unsigned.ipa Payload
          shasum -a 256 artifacts/After-Effects-4.0.0-unsigned.ipa > artifacts/After-Effects-4.0.0-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: After-Effects-4.0.0-unsigned-ipa
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
