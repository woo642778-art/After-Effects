name: Vertex2 Phase Validation

on:
  push:
    branches:
      - main
      - "agent/**"
    paths-ignore:
      - "Documentation/**"
      - "docs/**"
      - "README.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: phase-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Verify Phase 10 metadata and AI lock
        run: |
          set -euo pipefail
          grep -q 'currentSchemaVersion = 5' Sources/VertexProject/ProjectSchema.swift
          grep -q 'MARKETING_VERSION: 10.0.0' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 10' project.yml
          grep -q 'number: 10' Sources/VertexCore/Milestone.swift
          grep -q 'TARGETED_DEVICE_FAMILY: "2"' project.yml
          python3 Tools/ai/audit_models.py
          python3 -m unittest discover -s Tests/Tools -p 'test_*.py' -v
          git diff --check
      - name: Run portable Swift tests
        run: |
          set -euo pipefail
          swift test
