name: Export v13 staging chunks

on:
  push:
    branches:
      - agent/phase13-text-vector
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase13-text-vector
      - uses: actions/upload-artifact@v4
        with:
          name: v13-staging-chunks
          path: |
            Tools/staging/v13-part05.b64
            Tools/staging/v13-part06.b64
            Tools/staging/v13-part09.b64
          if-no-files-found: error
          retention-days: 1
