name: Vertex2 Roadmap App Validation

on:
  pull_request:
    branches:
      - agent/phase12-media-effects-automation
      - agent/phase28-roadmap
  workflow_dispatch:

concurrency:
  group: vertex2-roadmap-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipad-regression:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodebuild -version
          swift --version
      - name: Verify iPad-only product contract
        run: |
          set -euo pipefail
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER: com.woo642778.aftereffects' project.yml
          grep -q 'TARGETED_DEVICE_FAMILY: "2"' project.yml
          grep -q 'INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight' project.yml
          if grep -q 'UISupportedInterfaceOrientations_iPhone' project.yml; then
            echo 'iPhone orientation contract is present'
            exit 1
          fi
          git diff --check
      - name: Prepare pinned AI resources
        run: |
          set -euo pipefail
          rm -rf .build/ai-source App/GeneratedAIResources
          python3 Tools/ai/fetch_models.py --destination .build/ai-source
          python3 Tools/ai/audit_models.py --source-root .build/ai-source
          python3 Tools/ai/prepare_coreml_models.py \
            --source-root .build/ai-source \
            --output-root App/GeneratedAIResources \
            --repository-root .
      - name: Generate assets and Xcode project
        run: |
          set -euo pipefail
          bash Tools/generate_app_assets.sh
          xcodegen generate
      - name: Run Swift package tests
        env:
          VERTEX_AI_MODEL_ROOT: ${{ github.workspace }}/App/GeneratedAIResources
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$RUNNER_TEMP/roadmap-swift-tests.log"
      - name: Select and boot newest iPad Simulator
        run: |
          set -euo pipefail
          SIM_UDID="$(python3 - <<'PY'
          import json, re, subprocess
          payload = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          candidates = []
          for runtime, devices in payload.get('devices', {}).items():
              match = re.search(r'iOS-(\d+)-(\d+)', runtime)
              if not match:
                  continue
              version = (int(match.group(1)), int(match.group(2)))
              for device in devices:
                  name = device.get('name', '')
                  if device.get('isAvailable') and name.startswith('iPad'):
                      candidates.append((version, 1 if 'Pro' in name else 0, name, device['udid']))
          if not candidates:
              raise SystemExit('No available iPad Simulator found')
          candidates.sort(reverse=True)
          print(candidates[0][3])
          PY
          )"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
      - name: Run iPad app regression tests
        env:
          VERTEX_AI_MODEL_ROOT: ${{ github.workspace }}/App/GeneratedAIResources
        run: |
          set -o pipefail
          xcodebuild \
            -project Vertex.xcodeproj \
            -scheme Vertex \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$PWD/DerivedDataRoadmapTests" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee "$RUNNER_TEMP/roadmap-ipad-tests.log"
      - name: Upload regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roadmap-regression-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/roadmap-swift-tests.log
            ${{ runner.temp }}/roadmap-ipad-tests.log
          if-no-files-found: warn
          retention-days: 7
