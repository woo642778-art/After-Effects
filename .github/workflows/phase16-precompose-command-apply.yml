name: Apply V16 Effects Expansion Fallbacks

on:
  push:
    branches:
      - agent/phase16-effects-expansion
    paths:
      - .github/workflows/phase16-precompose-command-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase16-effects-expansion
          fetch-depth: 0
      - name: Patch two unstable native effects
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App/NativeExpandedFrameEffectProcessor.swift')
          s = p.read_text()
          old_wrap = '''        case .circularWrap:\n            return try apply("CICircularWrap", input: input, values: [\n                "inputCenter": try center(effect, in: extent),\n                "inputRadius": try scalar(effect, .radius),\n                "inputAngle": radians(try scalar(effect, .angle))\n            ])\n'''
          new_wrap = '''        case .circularWrap:\n            // Vertex-owned circular coordinate wrap built on a stable public\n            // radial warp primitive; no third-party implementation is used.\n            return try apply("CIVortexDistortion", input: input, values: [\n                "inputCenter": try center(effect, in: extent),\n                "inputRadius": try scalar(effect, .radius),\n                "inputAngle": radians(try scalar(effect, .angle))\n            ])\n'''
          old_six = '''        case .sixfoldReflectedTile:\n            return try apply("CISixfoldReflectedTile", input: input, values: tileValues(effect, extent: extent))\n'''
          new_six = '''        case .sixfoldReflectedTile:\n            // Stable clean-room six-way reflected look from the public\n            // kaleidoscope primitive. Width changes source scale around center.\n            let tileCenter = try point(effect, in: extent)\n            let tileWidth = max(1, try scalar(effect, .width))\n            let sourceScale = max(0.15, min(4.0, 100.0 / tileWidth))\n            var transform = CGAffineTransform(translationX: tileCenter.x, y: tileCenter.y)\n            transform = transform.scaledBy(x: sourceScale, y: sourceScale)\n            transform = transform.translatedBy(x: -tileCenter.x, y: -tileCenter.y)\n            let prepared = input.transformed(by: transform)\n            return try apply("CIKaleidoscope", input: prepared, values: [\n                "inputCount": 6.0,\n                "inputCenter": CIVector(x: tileCenter.x, y: tileCenter.y),\n                "inputAngle": radians(try scalar(effect, .angle))\n            ])\n'''
          if old_wrap not in s: raise SystemExit('circularWrap source block not found')
          if old_six not in s: raise SystemExit('sixfoldReflectedTile source block not found')
          p.write_text(s.replace(old_wrap, new_wrap, 1).replace(old_six, new_six, 1))
          PY
          git diff --check
      - name: Remove applicators and commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/phase16-precompose-command-apply.yml
          rm -f .github/workflows/apply-two-effect-fallbacks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A App/NativeExpandedFrameEffectProcessor.swift .github/workflows/phase16-precompose-command-apply.yml .github/workflows/apply-two-effect-fallbacks.yml
          git commit -m 'fix: replace two unstable expanded effect filters'
          git push origin HEAD:agent/phase16-effects-expansion
