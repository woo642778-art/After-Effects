name: Apply expanded effect operator fixes
on:
  push:
    paths:
      - .github/workflows/apply-expanded-effect-operator-fixes.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase16-effects-expansion
      - name: Parenthesize throwing scalar operands
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('App/NativeExpandedFrameEffectProcessor.swift')
          s = p.read_text()
          replacements = {
            'extent.height * try scalar(effect, .focusPosition)': 'extent.height * (try scalar(effect, .focusPosition))',
            'extent.height * try scalar(effect, .focusWidth)': 'extent.height * (try scalar(effect, .focusWidth))',
            'extent.width * try scalar(effect, .centerX)': 'extent.width * (try scalar(effect, .centerX))',
            'extent.height * try scalar(effect, .centerY)': 'extent.height * (try scalar(effect, .centerY))',
            '1 - try scalar(effect, .threshold)': '1 - (try scalar(effect, .threshold))',
            'try radians(try scalar(effect,': 'radians(try scalar(effect,'
          }
          for old, new in replacements.items():
              if old not in s:
                  print('not present:', old)
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add App/NativeExpandedFrameEffectProcessor.swift
          git commit -m 'fix: parenthesize throwing Core Image parameters'
          git push origin HEAD:agent/phase16-effects-expansion
