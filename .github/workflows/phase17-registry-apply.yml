name: Apply V17 Effect Registry

on:
  push:
    branches:
      - agent/phase17-particles-music-effects
    paths:
      - .github/workflows/phase17-registry-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase17-particles-music-effects
      - name: Patch descriptor category and registry
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Sources/VertexProject/ProjectEffectDescriptor.swift')
          s = p.read_text()
          s = s.replace('    case keying\n    case ai\n', '    case keying\n    case particlesAndProcedural\n    case ai\n', 1)
          s = s.replace('        case .keying: "Keying"\n        case .ai: "AI"\n', '        case .keying: "Keying"\n        case .particlesAndProcedural: "Particles & Procedural"\n        case .ai: "AI"\n', 1)
          s = s.replace('    ] + ProjectEffectExpansionDescriptors.all\n', '    ] + ProjectEffectExpansionDescriptors.all + ProjectEffectV17Descriptors.all\n', 1)
          if 'particlesAndProcedural' not in s or 'ProjectEffectV17Descriptors.all' not in s:
              raise SystemExit('V17 descriptor patch did not apply')
          p.write_text(s)
          PY
          git diff --check
      - name: Commit and remove applicator
        run: |
          set -euo pipefail
          rm .github/workflows/phase17-registry-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Sources/VertexProject/ProjectEffectDescriptor.swift .github/workflows/phase17-registry-apply.yml
          git commit -m 'feat: register V17 particles and effect descriptors'
          git push origin HEAD:agent/phase17-particles-music-effects
