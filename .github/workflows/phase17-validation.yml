name: Vertex2 17 Validation

on:
  push:
    branches:
      - agent/phase17-particles-focus-audio
  pull_request:
    branches:
      - agent/phase16-effects-expansion
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vertex2-v17-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipad-v17-contracts:
    runs-on: macos-15
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Select Xcode and install XcodeGen
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Verify V17 source contracts
        run: |
          set -euo pipefail
          grep -q 'ProjectEffectType.allCases.count == 113' Tests/VertexProjectTests/Phase17ParticlesAndProceduralTests.swift
          grep -q 'tracks.count >= 24' Tests/VertexAppTests/FocusMusicTests.swift
          grep -q 'static let category: AVAudioSession.Category = .playback' App/FocusMusicPlayer.swift
          grep -q 'struct V17GPUFrameEffectProcessor' App/V17GPUFrameEffectProcessor.swift
          git diff --check
      - name: Validate and prepare pinned AI resources
        run: |
          set -euo pipefail
          python3 Tools/ai/audit_models.py
          python3 -m unittest discover -s Tests/Tools -p 'test_*.py' -v
          rm -rf .build/ai-source App/GeneratedAIResources
          python3 Tools/ai/fetch_models.py --destination .build/ai-source
          python3 Tools/ai/audit_models.py --source-root .build/ai-source
          python3 Tools/ai/prepare_coreml_models.py --source-root .build/ai-source --output-root App/GeneratedAIResources --repository-root .
      - name: Generate assets and Xcode project
        run: |
          set -euo pipefail
          bash Tools/generate_app_assets.sh
          xcodegen generate
      - name: Boot newest iPad Simulator
        run: |
          set -euo pipefail
          SIM_UDID="$(python3 - <<'PY'
          import json, re, subprocess
          payload=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          c=[]
          for runtime,devices in payload.get('devices',{}).items():
              m=re.search(r'iOS-(\d+)-(\d+)',runtime)
              if not m: continue
              v=(int(m.group(1)),int(m.group(2)))
              for d in devices:
                  if d.get('isAvailable') and d.get('name','').startswith('iPad'):
                      c.append((v,1 if 'Pro' in d.get('name','') else 0,d['udid']))
          if not c: raise SystemExit('No available iPad Simulator found')
          c.sort(reverse=True); print(c[0][2])
          PY
          )"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl shutdown all || true
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
      - name: Run complete iPad app tests including Focus Music and V17 GPU
        env:
          VERTEX_AI_MODEL_ROOT: ${{ github.workspace }}/App/GeneratedAIResources
        run: |
          set -o pipefail
          xcodebuild -project Vertex.xcodeproj -scheme Vertex -configuration Debug -sdk iphonesimulator -destination "id=$SIM_UDID" -derivedDataPath "$PWD/DerivedDataV17" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" test 2>&1 | tee "$RUNNER_TEMP/vertex2-v17-ipad.log"
      - name: Upload V17 validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vertex2-v17-ipad-log
          path: ${{ runner.temp }}/vertex2-v17-ipad.log
          if-no-files-found: warn
          retention-days: 7
