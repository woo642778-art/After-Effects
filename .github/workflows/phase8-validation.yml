name: Phase 8 Validation

on:
  pull_request:
    branches:
      - agent/phase-8-validation-base
  workflow_dispatch:

concurrency:
  group: phase8-validation-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  portable-tests:
    name: Phase 8 portable Swift tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Verify Phase 8 contracts
        run: |
          set -euo pipefail
          grep -q 'currentSchemaVersion = 4' Sources/VertexProject/ProjectSchema.swift
          grep -q 'currentAppVersion = "8.0.0"' Sources/VertexProject/ProjectSchema.swift
          grep -q 'PRODUCT_NAME: Vertex2' project.yml
          grep -q 'MARKETING_VERSION: 8.0.0' project.yml
          grep -q 'CURRENT_PROJECT_VERSION: 8' project.yml
      - name: Run portable Swift tests
        run: |
          set -euo pipefail
          swift test --parallel

  macos-native-tests:
    name: Phase 8 macOS native Metal regression
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version
      - name: Run native Swift tests
        run: |
          set -euo pipefail
          swift test --parallel
