name: Phase 9 SDD Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/phase9-sdd-runner

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: phase9-sdd-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  portable-tasks-3-to-7:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Configure task commits
        run: |
          git config user.name 'vertex2-phase9-bot'
          git config user.email 'actions@users.noreply.github.com'

      - name: Task 3 RED - snapping and selection
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task03_red.py
          set +e
          swift test --filter TimelineSnapEngineTests > "$RUNNER_TEMP/task3-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/task3-red.log"
          test "$status" -ne 0
      - name: Task 3 GREEN
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task03_green.py
          swift test --filter TimelineSnapEngineTests
          swift test --filter TimelineSelectionTests
          git diff --check
          git add Sources/VertexTimeline Tests/VertexTimelineTests
          git commit -m 'feat(timeline): add deterministic snapping and selection'

      - name: Task 4 RED - transactional timeline commands
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task04_red.py
          set +e
          swift test --filter ProjectTimelineCommandTests > "$RUNNER_TEMP/task4-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/task4-red.log"
          test "$status" -ne 0
      - name: Task 4 GREEN
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task04_green.py
          swift test --filter ProjectTimelineCommandTests
          swift test --filter VertexTimelineTests
          git diff --check
          git add Sources/VertexProject Sources/VertexTimeline App/ProjectWorkspaceViewModel.swift project.yml Tests/VertexProjectTests/ProjectTimelineCommandTests.swift
          git commit -m 'feat(project): make timeline edits transactional'

      - name: Task 5 RED - typed ordered effects
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task05_red.py
          python3 Tools/phase9_tasks/task05_testfix.py
          set +e
          swift test --filter ProjectEffectTests > "$RUNNER_TEMP/task5-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/task5-red.log"
          test "$status" -ne 0
      - name: Task 5 GREEN
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task05_green.py
          swift test --filter ProjectEffectTests
          swift test --filter ProjectEffectCommandTests
          swift test --filter ProjectTimelineCommandTests
          git diff --check
          git add Sources/VertexProject Tests/VertexProjectTests/ProjectEffectTests.swift Tests/VertexProjectTests/ProjectEffectCommandTests.swift
          git commit -m 'feat(effects): add typed ordered layer effect stack'

      - name: Task 6 RED - composition effect evaluation
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task06_red.py
          python3 Tools/phase9_tasks/task06_testfix.py
          set +e
          swift test --filter EffectGraphCompilerTests > "$RUNNER_TEMP/task6-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/task6-red.log"
          test "$status" -ne 0
      - name: Apply Task 6 GREEN implementation
        run: python3 Tools/phase9_tasks/task06_green.py
      - name: Task 6 GREEN focused test
        id: task6-green
        continue-on-error: true
        run: |
          set -o pipefail
          swift test --filter EffectGraphCompilerTests 2>&1 | tee "$RUNNER_TEMP/task6-green.log"
      - name: Preserve Task 6 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task6-green-diagnostics
          path: ${{ runner.temp }}/task6-green.log
          if-no-files-found: error
          retention-days: 3
      - name: Stop on Task 6 GREEN failure
        if: steps.task6-green.outcome == 'failure'
        run: exit 1
      - name: Complete Task 6 GREEN
        run: |
          set -euo pipefail
          swift test --filter Phase8CompositionGraphTests
          git diff --check
          git add Sources/VertexComposition Tests/VertexCompositionTests/EffectGraphCompilerTests.swift
          git commit -m 'feat(composition): evaluate layer effects before masks'

      - name: Task 7 RED - deterministic AI frame key
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task07_red.py
          set +e
          swift test --filter AIFrameEffectKeyTests > "$RUNNER_TEMP/task7-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/task7-red.log"
          test "$status" -ne 0
      - name: Task 7 GREEN
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task07_green.py
          swift test --filter AIFrameEffectKeyTests
          swift test --filter VertexAITests
          git diff --check
          git add Sources/VertexAI Tests/VertexAITests/AIFrameEffectKeyTests.swift
          git commit -m 'feat(ai): add deterministic frame effect cache keys'

      - name: Portable regression gate
        run: |
          set -euo pipefail
          swift test --filter VertexTimelineTests
          swift test --filter ProjectTimelineSchemaTests
          swift test --filter ProjectTimelineCommandTests
          swift test --filter ProjectEffectTests
          swift test --filter ProjectEffectCommandTests
          swift test --filter EffectGraphCompilerTests
          swift test --filter AIFrameEffectKeyTests
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Push task commit stack
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: git push origin HEAD:"$HEAD_BRANCH"
