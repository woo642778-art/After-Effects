name: Phase 9 SDD Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/phase9-sdd-runner

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: phase9-sdd-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  app-tasks-8-to-9:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Select Xcode and install XcodeGen
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          git config user.name 'vertex2-phase9-bot'
          git config user.email 'actions@users.noreply.github.com'
      - name: Select newest iPhone Simulator
        run: |
          set -euo pipefail
          SIM_UDID="$(python3 - <<'PY'
          import json,re,subprocess
          payload=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          c=[]
          for runtime,devices in payload.get('devices',{}).items():
              m=re.search(r'iOS-(\d+)-(\d+)',runtime)
              if not m: continue
              v=(int(m.group(1)),int(m.group(2)))
              for d in devices:
                  if d.get('isAvailable') and d.get('name','').startswith('iPhone'): c.append((v,d['name'],d['udid']))
          if not c: raise SystemExit('No iPhone Simulator')
          c.sort(reverse=True); print(c[0][2])
          PY
          )"
          echo "SIM_UDID=$SIM_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
      - name: Prepare Xcode project
        run: |
          bash Tools/generate_app_assets.sh
          xcodegen generate

      - name: Task 8 RED
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task08_red.py
          python3 Tools/phase9_tasks/task08_testfix.py
          xcodegen generate
          set +e
          xcodebuild test -project Vertex.xcodeproj -scheme Vertex -configuration Debug -sdk iphonesimulator -destination "id=$SIM_UDID" -derivedDataPath "$PWD/DerivedDataTask8Red" CODE_SIGNING_ALLOWED=NO -only-testing:VertexAppTests/AIFrameEffectServiceTests > "$RUNNER_TEMP/task8-red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo 'Task 8 RED unexpectedly passed'; exit 1; fi
          grep -n -C 3 -m 40 -E 'error:|cannot find|AIFrameEffectService' "$RUNNER_TEMP/task8-red.log" || tail -n 100 "$RUNNER_TEMP/task8-red.log"
      - name: Task 8 GREEN
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task08_green.py
          python3 Tools/phase9_tasks/task08_green_import_fix.py
          xcodegen generate
          xcodebuild test -project Vertex.xcodeproj -scheme Vertex -configuration Debug -sdk iphonesimulator -destination "id=$SIM_UDID" -derivedDataPath "$PWD/DerivedDataTask8" CODE_SIGNING_ALLOWED=NO -only-testing:VertexAppTests/AIFrameEffectServiceTests | tee "$RUNNER_TEMP/task8-green.log"
          git diff --check
          git add App/AIFrameEffectService.swift App/BundledAIEnvironment+FrameEffects.swift App/CompositionEffectResolverAdapter.swift Tests/VertexAppTests/AIFrameEffectServiceTests.swift
          git commit -m 'feat(ai): add prioritized frame effect service'

      - name: Task 9 RED
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task09_red.py
          set +e
          swift test --filter AIEffectBakeCommandTests > "$RUNNER_TEMP/task9-red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then echo 'Task 9 RED unexpectedly passed'; exit 1; fi
          grep -n -C 3 -m 40 -E 'error:|registerBakedAIEffect|ProjectAIEffectBakeRegistration' "$RUNNER_TEMP/task9-red.log" || tail -n 100 "$RUNNER_TEMP/task9-red.log"
      - name: Task 9 GREEN
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task09_green.py
          swift test --filter AIEffectBakeCommandTests
          xcodegen generate
          xcodebuild test -project Vertex.xcodeproj -scheme Vertex -configuration Debug -sdk iphonesimulator -destination "id=$SIM_UDID" -derivedDataPath "$PWD/DerivedDataTask9" CODE_SIGNING_ALLOWED=NO -only-testing:VertexAppTests/AIEffectBakeCoordinatorTests | tee "$RUNNER_TEMP/task9-green.log"
          git diff --check
          git add Sources/VertexProject App/AIEffectBakeCoordinator.swift App/ProjectWorkspaceViewModel.swift Tests/VertexProjectTests/AIEffectBakeCommandTests.swift Tests/VertexAppTests/AIEffectBakeCoordinatorTests.swift
          git commit -m 'feat(ai): add atomic bake-to-layer workflow'

      - name: App regression gate
        run: |
          set -euo pipefail
          swift test --filter ProjectEffectTests
          swift test --filter EffectGraphCompilerTests
          swift test --filter AIEffectBakeCommandTests
          xcodebuild test -project Vertex.xcodeproj -scheme Vertex -configuration Debug -sdk iphonesimulator -destination "id=$SIM_UDID" -derivedDataPath "$PWD/DerivedDataTask89Regression" CODE_SIGNING_ALLOWED=NO -only-testing:VertexAppTests/AIFrameEffectServiceTests -only-testing:VertexAppTests/AIEffectBakeCoordinatorTests
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Push Task 8 and 9 commits
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: git push origin HEAD:"$HEAD_BRANCH"
      - name: Upload task logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-task8-9-logs
          path: ${{ runner.temp }}/task*-*.log
          if-no-files-found: warn
          retention-days: 3
