name: Phase 9 SDD Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/phase9-sdd-runner

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: phase9-sdd-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Apply Task 1 feature and RED regression test
        run: |
          set -euo pipefail
          python3 Tools/phase9_tasks/task01.py
          python3 Tools/phase9_tasks/task01_fix_red.py
      - name: Verify RED for schema 3 to 4 metadata regression
        run: |
          set -euo pipefail
          set +e
          swift test --filter schema3MigratesToSchema4 > "$RUNNER_TEMP/task1-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/task1-red.log"
          if [ "$status" -eq 0 ]; then
            echo 'Expected schema3MigratesToSchema4 to fail before the migration-version fix.'
            exit 1
          fi
          grep -q '8.0.0' "$RUNNER_TEMP/task1-red.log" || {
            echo 'RED failure did not exercise the expected 8.0.0 metadata assertion.'
            exit 1
          }
      - name: Apply minimal GREEN fix
        run: python3 Tools/phase9_tasks/task01_fix_green.py
      - name: Run Task 1 focused tests
        run: |
          set -euo pipefail
          swift test --filter schema3MigratesToSchema4
          swift test --filter ProjectTimelineSchemaTests
          swift test --filter Schema4To5MigrationTests
      - name: Verify diff hygiene
        run: |
          git diff --check
          git status --short
      - name: Commit generated Task 1 implementation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'vertex2-phase9-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Sources Tests
          if git diff --cached --quiet; then
            echo 'No generated Task 1 changes to commit.'
            exit 0
          fi
          git commit -m 'feat(project): add schema 5 timeline primitives'
          git push origin HEAD:"$HEAD_BRANCH"
