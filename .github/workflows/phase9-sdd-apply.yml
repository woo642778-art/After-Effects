name: Phase 9 SDD Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/phase9-sdd-runner

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: phase9-sdd-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Detect completed Task 2
        id: task-state
        run: |
          if [ -f Sources/VertexTimeline/TimelineEngine.swift ]; then
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply Task 2 RED tests
        if: steps.task-state.outputs.applied != 'true'
        run: python3 Tools/phase9_tasks/task02_red.py
      - name: Verify Task 2 RED
        if: steps.task-state.outputs.applied != 'true'
        run: |
          set -euo pipefail
          set +e
          swift test --filter VertexTimelineTests > "$RUNNER_TEMP/task2-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/task2-red.log"
          if [ "$status" -eq 0 ]; then
            echo 'Expected VertexTimeline tests to fail before the module exists.'
            exit 1
          fi
          grep -Eq "VertexTimeline|no such module|unknown module" "$RUNNER_TEMP/task2-red.log" || {
            echo 'RED failure was not caused by the missing VertexTimeline implementation.'
            exit 1
          }
      - name: Apply Task 2 GREEN implementation
        if: steps.task-state.outputs.applied != 'true'
        run: python3 Tools/phase9_tasks/task02_green.py
      - name: Run Task 2 timeline tests
        run: |
          set -euo pipefail
          swift test --filter VertexTimelineTests
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit generated Task 2 implementation
        if: steps.task-state.outputs.applied != 'true'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'vertex2-phase9-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Package.swift Package@swift-6.0.swift Sources/VertexTimeline Tests/VertexTimelineTests
          git commit -m 'feat(timeline): add exact-time edit engine'
          git push origin HEAD:"$HEAD_BRANCH"
