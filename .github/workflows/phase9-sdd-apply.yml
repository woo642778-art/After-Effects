name: Phase 9 SDD Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/phase9-sdd-runner

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: phase9-sdd-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - name: Detect completed Task 2 review fix
        id: task-state
        run: |
          if grep -q 'private func shiftedLayer' Sources/VertexTimeline/TimelineEngine.swift; then
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          else
            echo 'applied=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply Task 2 review RED test
        if: steps.task-state.outputs.applied != 'true'
        run: python3 Tools/phase9_tasks/task02_review_red.py
      - name: Verify keyframe placement RED
        if: steps.task-state.outputs.applied != 'true'
        run: |
          set -euo pipefail
          set +e
          swift test --filter moveShiftsLayerAnimationKeyframes > "$RUNNER_TEMP/task2-review-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/task2-review-red.log"
          if [ "$status" -eq 0 ]; then
            echo 'Expected moving a layer to fail the attached-keyframe placement test before the fix.'
            exit 1
          fi
      - name: Apply Task 2 review GREEN fix
        if: steps.task-state.outputs.applied != 'true'
        run: python3 Tools/phase9_tasks/task02_review_green.py
      - name: Run reviewed Task 2 tests
        run: swift test --filter VertexTimelineTests
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit Task 2 review fix
        if: steps.task-state.outputs.applied != 'true'
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'vertex2-phase9-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Sources/VertexTimeline Tests/VertexTimelineTests
          git commit -m 'fix(timeline): move keyframes with layer placement'
          git push origin HEAD:"$HEAD_BRANCH"
