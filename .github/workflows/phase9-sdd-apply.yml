name: Phase 9 SDD Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - agent/phase9-sdd-runner

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: phase9-sdd-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply Phase 9 task scripts
        run: |
          set -euo pipefail
          for script in Tools/phase9_tasks/task*.py; do
            echo "==> $script"
            python3 "$script"
          done
      - name: Run portable task tests
        run: |
          set -euo pipefail
          swift test --filter ProjectTimelineSchemaTests
          swift test --filter Schema4To5MigrationTests
      - name: Verify diff hygiene
        run: |
          git diff --check
          git status --short
      - name: Commit generated task implementation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name 'vertex2-phase9-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add App Sources Tests Package.swift Package@swift-6.0.swift project.yml .github/workflows Tools/phase9_tasks 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat(project): add schema 5 timeline primitives'
          git push origin HEAD:"$HEAD_BRANCH"
